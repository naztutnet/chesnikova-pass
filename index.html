<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />

    <title>CHESNIKOVA PASS</title>

  <body>
    <div class="app-shell">
      <header class="topbar">
